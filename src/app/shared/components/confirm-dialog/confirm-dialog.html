<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" matButton (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button type="button" matButton="filled" (click)="confirm()">
    {{ data.confirmLabel ?? 'Confirm' }}
  </button>
</mat-dialog-actions>
