<div class="grid min-h-screen lg:grid-cols-2">
  <!-- Brand panel. Intentionally dark in both themes, like the marketing side of
       most SaaS sign-in screens, so it never competes with the form. -->
  <aside class="hidden flex-col justify-between bg-slate-900 p-12 text-slate-100 lg:flex">
    <div class="flex items-center gap-3">
      <span class="grid size-9 place-items-center rounded-xl bg-emerald-500 text-slate-900">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true"
        >
          <path d="M3 17l6-6 4 4 7-7" />
          <path d="M14 7h6v6" />
        </svg>
      </span>
      <span class="text-lg font-semibold tracking-tight">Fintrack</span>
    </div>

    <div>
      <h2 class="max-w-sm text-3xl font-semibold leading-tight tracking-tight">
        Every euro, accounted for.
      </h2>
      <p class="mt-3 max-w-sm text-sm leading-relaxed text-slate-400">
        Track your spending, spot the patterns, and let AI surface what your numbers are already
        telling you.
      </p>

      <div class="mt-10 w-full max-w-xs rounded-2xl border border-white/10 bg-white/5 p-5">
        <p class="text-xs font-medium uppercase tracking-wider text-slate-400">Current balance</p>
        <p class="mt-1 text-2xl font-semibold tabular-nums">€2,480.50</p>
        <dl class="mt-5 space-y-2 text-sm">
          <div class="flex items-center justify-between">
            <dt class="text-slate-400">Income</dt>
            <dd class="font-medium tabular-nums text-emerald-400">+€3,200.00</dd>
          </div>
          <div class="flex items-center justify-between">
            <dt class="text-slate-400">Expenses</dt>
            <dd class="font-medium tabular-nums text-red-400">−€719.50</dd>
          </div>
        </dl>
      </div>
    </div>

    <p class="text-xs text-slate-500">Built with Angular and Supabase</p>
  </aside>

  <main class="flex items-center justify-center bg-surface px-6 py-12">
    <div class="w-full max-w-sm">
      <div class="mb-10 flex items-center gap-3 lg:hidden">
        <span class="grid size-9 place-items-center rounded-xl bg-emerald-500 text-slate-900">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-5"
            aria-hidden="true"
          >
            <path d="M3 17l6-6 4 4 7-7" />
            <path d="M14 7h6v6" />
          </svg>
        </span>
        <span class="text-lg font-semibold tracking-tight">Fintrack</span>
      </div>

      <h1 class="text-3xl font-semibold tracking-tight">{{ heading() }}</h1>
      <p class="mt-2 text-sm text-on-surface-variant">{{ subheading() }}</p>

      <div class="mt-8">
        <ng-content />
      </div>
    </div>
  </main>
</div>
