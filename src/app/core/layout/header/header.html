<mat-toolbar class="!bg-surface !text-on-surface gap-2 border-b border-outline-variant">
  <button
    type="button"
    matIconButton
    class="lg:!hidden"
    (click)="menuButtonClicked.emit()"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="flex-1"></span>

  <button
    type="button"
    matIconButton
    (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
  >
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button
    type="button"
    matIconButton
    [matMenuTriggerFor]="userMenu"
    [attr.aria-label]="'Account menu for ' + user.displayName()"
  >
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="px-4 py-2 text-sm text-on-surface-variant">
      {{ user.displayName() }}
    </div>
    <a mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </a>
    <button type="button" mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
  </mat-menu>
</mat-toolbar>
