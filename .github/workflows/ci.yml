name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` rather than `npm install`: installs exactly what the lockfile
      # pins, and fails if the lockfile and package.json disagree.
      - run: npm ci

      # Formatting first: it is the fastest check and the most trivial to fix.
      - name: Check formatting
        run: npm run format:check

      # Includes the eslint-plugin-boundaries rules, so an import that breaks the
      # core/shared/features architecture fails the build rather than being found
      # in review.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
